[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
thiserror = "2"
bitflags = "2"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webrtc-dtls = { version = "0.12", features = ["pem"] }
webrtc-util = "0.11"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
get_if_addrs = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
keycode = "1.0"
